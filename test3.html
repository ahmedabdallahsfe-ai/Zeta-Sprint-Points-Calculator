<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS 12 Test 3 - Arabic RTL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f4f7fb;color:#1a1f36}
.hdr{background:#0d47a1;color:#fff;padding:20px;text-align:center}
.tabs{display:flex}
.tb{flex:1;padding:12px;background:#0a3a8a;color:#fff;border:none;font-size:14px}
.tb.active{background:#1565c0}
.panel{display:none;padding:20px}
.panel.active{display:block}
.crb{display:flex;align-items:flex-start;gap:12px;background:linear-gradient(135deg,#1F2937,#111827);border:1px solid #D4A72C;border-radius:10px;padding:12px 16px;margin-top:4px;margin-bottom:10px}
.crb-text{color:#fff;font-size:13px;margin-bottom:6px}
.crb-ar{direction:rtl}
</style>
</head>
<body>
<div class="hdr"><h1>TEST 3 - Arabic RTL Text</h1></div>
<div class="tabs">
<button class="tb active" onclick="sw('a',this)">Tab A</button>
<button class="tb" onclick="sw('b',this)">Tab B</button>
</div>
<div class="panel active" id="panel-a">
  <div class="crb">
    <div class="crb-icon">🏆</div>
    <div class="crb-body">
      <div class="crb-title">WINNER PAGE TEST</div>
      <div class="crb-text">English text test line.</div>
      <div class="crb-text crb-ar" dir="rtl" lang="ar">أهلية الدخول إلى مجموعة الفائزين تعتمد فقط على مقارنة أداء مدير المنطقة</div>
    </div>
  </div>
  <p style="margin-top:20px;color:green;font-weight:bold">IF YOU SEE THIS GREEN TEXT, ARABIC RTL CONTENT RENDERS FINE</p>
</div>
<div class="panel" id="panel-b">
  <p style="color:blue;font-weight:bold">PANEL B VISIBLE</p>
</div>
<script>
function sw(id, btn){
  document.querySelectorAll('.tb').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
}
</script>
</body>
</html>
